x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-ecommerce}
  DB_USERNAME: ${DB_USERNAME:-ecommerce}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

x-admin-env: &admin-env
  <<: *db-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
  DB_CONNECTION: mysql
  SESSION_DRIVER: database
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  FILESYSTEM_DISK: local
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-plus-char-jwt-secret}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-api-key}
  API_GATEWAY_URL: http://api-gateway:3000

x-api-env: &api-env
  <<: *db-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-plus-char-jwt-secret}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-api-key}
  MAIL_HOST: mailpit
  MAIL_PORT: 1025

x-admin-build: &admin-build
  context: ./admin-service
  dockerfile: Dockerfile
  target: php

x-api-build: &api-build
  context: ./api-gateway
  dockerfile: Dockerfile
  target: development

services:
  admin-assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - ./admin-service:/app
      - /app/node_modules
    networks:
      - ecommerce

  admin-migrate:
    build: *admin-build
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
      [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
      grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force;
      php artisan migrate --force;
      chown -R www-data:www-data storage bootstrap/cache"
    volumes:
      - ./admin-service:/var/www/html
    environment: *admin-env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce

  api-migrate:
    build: *api-build
    command: npm run migration:run
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    environment: *api-env
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce

  seed:
    build: *admin-build
    user: www-data
    command: php artisan db:seed --force
    volumes:
      - ./admin-service:/var/www/html
    environment: *admin-env
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    networks:
      - ecommerce

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./admin-service:/var/www/admin-service:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      admin:
        condition: service_started
      api-gateway:
        condition: service_started
    networks:
      - ecommerce

  admin:
    build: *admin-build
    entrypoint: ["sh", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - ./admin-service:/var/www/html
    environment: *admin-env
    depends_on:
      admin-assets:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ecommerce

  admin-queue:
    build: *admin-build
    user: www-data
    command: php artisan queue:work redis --sleep=1 --tries=5
    restart: unless-stopped
    volumes:
      - ./admin-service:/var/www/html
    environment: *admin-env
    depends_on:
      admin:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecommerce

  api-gateway:
    build: *api-build
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    environment: *api-env
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ecommerce

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ecommerce

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - ecommerce

volumes:
  mysql_data:
  redis_data:
  api_gateway_node_modules:

networks:
  ecommerce:
    driver: bridge
