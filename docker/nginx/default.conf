upstream api_gateway {
    server api-gateway:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Service-to-service endpoints are only reachable inside the Docker network
    location /api/internal/ {
        return 404;
    }

    # NestJS API gateway
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public uploads (product images); avoids relying on storage:link symlinks across bind mounts
    location /storage/ {
        alias /var/www/admin-service/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Laravel admin panel (PHP-FPM)
    location / {
        root /var/www/admin-service/public;
        index index.php index.html;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/admin-service/public;
        fastcgi_pass admin:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }
}
